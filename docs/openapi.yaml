openapi: 3.1.0
info:
  title: Mirea CRM
  version: 1.0.0
  description: 'Публичный интерфейс системы. Единственный вход — шлюз: сервисы за ним публичных портов
    не имеют.


    Проверка доступа двухуровневая. Роль проверяет шлюз — она указана в описании каждого запроса. Принадлежность
    объекта проверяет сервис-владелец: специалист работает только со своими записями, администратор и
    управляющий — с любыми.


    Документ собирается из маршрутной таблицы шлюза и описаний самих сервисов, руками не правится: docs/build-openapi.py.'
servers:
- url: http://localhost:8000
  description: Локальный запуск
tags:
- name: Доступ
  description: Токены и права
- name: Организация
- name: Услуги
- name: Записи
- name: Склад
- name: Клиенты
- name: Расчёты
- name: Уведомления
- name: Аналитика
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Токен Keycloak области mirea.
  schemas:
    Appointment:
      type: object
      properties:
        id:
          type: string
          format: uuid
        branch_id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
        status:
          type: string
          enum:
          - scheduled
          - completed
          - cancelled
        price_kopecks:
          type: integer
          format: int64
    AppointmentOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        branch_id:
          type: string
          format: uuid
          title: Branch Id
        service_id:
          type: string
          format: uuid
          title: Service Id
        starts_at:
          type: string
          format: date-time
          title: Starts At
        ends_at:
          type: string
          format: date-time
          title: Ends At
        status:
          type: string
          title: Status
        price_kopecks:
          type: integer
          title: Price Kopecks
      type: object
      required:
      - id
      - branch_id
      - service_id
      - starts_at
      - ends_at
      - status
      - price_kopecks
      title: AppointmentOut
    BookRequest:
      type: object
      required:
      - branch_id
      - client_id
      - employee_id
      - service_id
      - starts_at
      properties:
        branch_id:
          type: string
          format: uuid
        client_id:
          type: string
          format: uuid
        employee_id:
          type: string
          format: uuid
        service_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
    BranchCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        address:
          type: string
          maxLength: 500
          minLength: 1
          title: Address
        timezone:
          type: string
          title: Timezone
          default: Europe/Moscow
      type: object
      required:
      - name
      - address
      title: BranchCreate
    BranchOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        company_id:
          type: string
          format: uuid
          title: Company Id
        name:
          type: string
          title: Name
        address:
          type: string
          title: Address
        timezone:
          type: string
          title: Timezone
      type: object
      required:
      - id
      - company_id
      - name
      - address
      - timezone
      title: BranchOut
    CancelRequest:
      type: object
      properties:
        reason:
          type: string
          description: Необязательна
    ClientCardOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        full_name:
          type: string
          title: Full Name
        phone:
          type: string
          title: Phone
        email:
          type: string
          title: Email
        telegram:
          type: string
          title: Telegram
        preferred:
          $ref: '#/components/schemas/PreferredChannel'
        branch_id:
          type: string
          format: uuid
          title: Branch Id
        points_balance:
          type: integer
          title: Points Balance
        appointments:
          items:
            $ref: '#/components/schemas/AppointmentOut'
          type: array
          title: Appointments
          default: []
      type: object
      required:
      - id
      - full_name
      - phone
      - email
      - telegram
      - preferred
      - branch_id
      - points_balance
      title: ClientCardOut
      description: 'Карточка клиента: своё состояние плюс история записей из booking.'
    ClientCreate:
      properties:
        full_name:
          type: string
          maxLength: 200
          minLength: 1
          title: Full Name
        phone:
          type: string
          pattern: ^\+?\d{10,15}$
          title: Phone
        branch_id:
          type: string
          format: uuid
          title: Branch Id
        email:
          type: string
          maxLength: 200
          title: Email
          default: ''
        telegram:
          type: string
          maxLength: 64
          title: Telegram
          default: ''
        preferred:
          $ref: '#/components/schemas/PreferredChannel'
          default: sms
      type: object
      required:
      - full_name
      - phone
      - branch_id
      title: ClientCreate
    ClientOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        full_name:
          type: string
          title: Full Name
        phone:
          type: string
          title: Phone
        email:
          type: string
          title: Email
        telegram:
          type: string
          title: Telegram
        preferred:
          $ref: '#/components/schemas/PreferredChannel'
        branch_id:
          type: string
          format: uuid
          title: Branch Id
        points_balance:
          type: integer
          title: Points Balance
      type: object
      required:
      - id
      - full_name
      - phone
      - email
      - telegram
      - preferred
      - branch_id
      - points_balance
      title: ClientOut
    CommissionOut:
      properties:
        employee_id:
          type: string
          format: uuid
          title: Employee Id
        since:
          type: string
          format: date-time
          title: Since
        until:
          type: string
          format: date-time
          title: Until
        invoices:
          type: integer
          title: Invoices
        commission_kopecks:
          type: integer
          title: Commission Kopecks
      type: object
      required:
      - employee_id
      - since
      - until
      - invoices
      - commission_kopecks
      title: CommissionOut
    CompanyCreate:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        inn:
          type: string
          pattern: ^\d{10}$|^\d{12}$
          title: Inn
      type: object
      required:
      - name
      - inn
      title: CompanyCreate
    CompanyOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        name:
          type: string
          title: Name
        inn:
          type: string
          title: Inn
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - id
      - name
      - inn
      - created_at
      title: CompanyOut
    ConsumableUsageOut:
      properties:
        consumable_id:
          type: string
          format: uuid
          title: Consumable Id
        unit:
          type: string
          title: Unit
        amount:
          type: number
          title: Amount
        write_offs:
          type: integer
          title: Write Offs
      type: object
      required:
      - consumable_id
      - unit
      - amount
      - write_offs
      title: ConsumableUsageOut
    ConsumablesReportOut:
      properties:
        since:
          type: string
          format: date-time
          title: Since
        until:
          type: string
          format: date-time
          title: Until
        branch_id:
          type: string
          format: uuid
          title: Branch Id
        items:
          items:
            $ref: '#/components/schemas/ConsumableUsageOut'
          type: array
          title: Items
      type: object
      required:
      - since
      - until
      - branch_id
      - items
      title: ConsumablesReportOut
    EmployeeCreate:
      properties:
        full_name:
          type: string
          maxLength: 200
          minLength: 1
          title: Full Name
        role:
          $ref: '#/components/schemas/EmployeeRole'
        keycloak_subject:
          type: string
          maxLength: 64
          title: Keycloak Subject
          default: ''
        shifts:
          items:
            $ref: '#/components/schemas/ShiftIn'
          type: array
          title: Shifts
      type: object
      required:
      - full_name
      - role
      title: EmployeeCreate
    EmployeeIdentityOut:
      properties:
        employee_id:
          type: string
          format: uuid
          title: Employee Id
        branch_id:
          type: string
          format: uuid
          title: Branch Id
        role:
          $ref: '#/components/schemas/EmployeeRole'
      type: object
      required:
      - employee_id
      - branch_id
      - role
      title: EmployeeIdentityOut
      description: Кем является учётная запись. Служебный ответ для шлюза.
    EmployeeOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        branch_id:
          type: string
          format: uuid
          title: Branch Id
        full_name:
          type: string
          title: Full Name
        role:
          $ref: '#/components/schemas/EmployeeRole'
        is_active:
          type: boolean
          title: Is Active
      type: object
      required:
      - id
      - branch_id
      - full_name
      - role
      - is_active
      title: EmployeeOut
    EmployeeRole:
      type: string
      enum:
      - admin
      - manager
      - specialist
      title: EmployeeRole
    Error:
      type: object
      properties:
        detail:
          description: Причина отказа
    FunnelOut:
      properties:
        since:
          type: string
          format: date-time
          title: Since
        until:
          type: string
          format: date-time
          title: Until
        branch_id:
          type: string
          format: uuid
          title: Branch Id
        created:
          type: integer
          title: Created
        completed:
          type: integer
          title: Completed
        cancelled:
          type: integer
          title: Cancelled
        pending:
          type: integer
          title: Pending
        conversion:
          type: number
          title: Conversion
      type: object
      required:
      - since
      - until
      - branch_id
      - created
      - completed
      - cancelled
      - pending
      - conversion
      title: FunnelOut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InvoiceOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        appointment_id:
          type: string
          format: uuid
          title: Appointment Id
        branch_id:
          type: string
          format: uuid
          title: Branch Id
        client_id:
          type: string
          format: uuid
          title: Client Id
        employee_id:
          type: string
          format: uuid
          title: Employee Id
        total_kopecks:
          type: integer
          title: Total Kopecks
        commission_kopecks:
          type: integer
          title: Commission Kopecks
        status:
          $ref: '#/components/schemas/InvoiceStatus'
        created_at:
          type: string
          format: date-time
          title: Created At
        paid_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Paid At
      type: object
      required:
      - id
      - appointment_id
      - branch_id
      - client_id
      - employee_id
      - total_kopecks
      - commission_kopecks
      - status
      - created_at
      - paid_at
      title: InvoiceOut
    InvoiceStatus:
      type: string
      enum:
      - issued
      - paid
      - cancelled
      title: InvoiceStatus
    LoyaltyEntryOut:
      properties:
        invoice_id:
          type: string
          format: uuid
          title: Invoice Id
        paid_kopecks:
          type: integer
          title: Paid Kopecks
        points:
          type: integer
          title: Points
        created_at:
          type: string
          format: date-time
          title: Created At
      type: object
      required:
      - invoice_id
      - paid_kopecks
      - points
      - created_at
      title: LoyaltyEntryOut
    LoyaltyOut:
      properties:
        client_id:
          type: string
          format: uuid
          title: Client Id
        points_balance:
          type: integer
          title: Points Balance
        entries:
          items:
            $ref: '#/components/schemas/LoyaltyEntryOut'
          type: array
          title: Entries
      type: object
      required:
      - client_id
      - points_balance
      - entries
      title: LoyaltyOut
    NormIn:
      properties:
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        unit:
          type: string
          maxLength: 16
          minLength: 1
          title: Unit
        amount:
          type: number
          exclusiveMinimum: 0.0
          title: Amount
      type: object
      required:
      - name
      - unit
      - amount
      title: NormIn
    NormOut:
      properties:
        consumable_id:
          type: string
          format: uuid
          title: Consumable Id
        name:
          type: string
          title: Name
        unit:
          type: string
          title: Unit
        amount:
          type: number
          title: Amount
      type: object
      required:
      - consumable_id
      - name
      - unit
      - amount
      title: NormOut
    Notification:
      type: object
      properties:
        id:
          type: string
          format: uuid
        channel:
          type: string
          enum:
          - sms
          - email
          - telegram
          - dashboard
        recipient:
          type: string
        subject:
          type: string
        body:
          type: string
        status:
          type: string
          enum:
          - sent
          - failed
        reason:
          type: string
        sent_at:
          type: string
          format: date-time
    PreferredChannel:
      type: string
      enum:
      - sms
      - email
      - telegram
      title: PreferredChannel
    PriceUpdate:
      properties:
        price_kopecks:
          type: integer
          minimum: 0.0
          title: Price Kopecks
      type: object
      required:
      - price_kopecks
      title: PriceUpdate
    ReplenishItem:
      type: object
      required:
      - name
      - unit
      - amount
      properties:
        consumable_id:
          type: string
          format: uuid
          description: Пусто для нового материала
        name:
          type: string
        unit:
          type: string
          example: г
        amount:
          type: number
          minimum: 0
    ReplenishRequest:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ReplenishItem'
    RevenueOut:
      properties:
        since:
          type: string
          format: date-time
          title: Since
        until:
          type: string
          format: date-time
          title: Until
        branch_id:
          type: string
          format: uuid
          title: Branch Id
        branch_name:
          type: string
          title: Branch Name
        invoices:
          type: integer
          title: Invoices
        total_kopecks:
          type: integer
          title: Total Kopecks
        average_kopecks:
          type: integer
          title: Average Kopecks
      type: object
      required:
      - since
      - until
      - branch_id
      - branch_name
      - invoices
      - total_kopecks
      - average_kopecks
      title: RevenueOut
    Route:
      type: object
      properties:
        method:
          type: string
        path:
          type: string
        upstream:
          type: string
        roles:
          type: array
          items:
            type: string
        summary:
          type: string
    ScheduleOut:
      properties:
        employee:
          $ref: '#/components/schemas/EmployeeOut'
        shifts:
          items:
            $ref: '#/components/schemas/ShiftOut'
          type: array
          title: Shifts
      type: object
      required:
      - employee
      - shifts
      title: ScheduleOut
    SendRequest:
      type: object
      required:
      - client_id
      - subject
      - body
      properties:
        client_id:
          type: string
          format: uuid
        subject:
          type: string
        body:
          type: string
    ServiceCreate:
      properties:
        branch_id:
          type: string
          format: uuid
          title: Branch Id
        name:
          type: string
          maxLength: 200
          minLength: 1
          title: Name
        duration_minutes:
          type: integer
          maximum: 480.0
          exclusiveMinimum: 0.0
          title: Duration Minutes
        price_kopecks:
          type: integer
          minimum: 0.0
          title: Price Kopecks
        norms:
          items:
            $ref: '#/components/schemas/NormIn'
          type: array
          title: Norms
      type: object
      required:
      - branch_id
      - name
      - duration_minutes
      - price_kopecks
      title: ServiceCreate
    ServiceOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        branch_id:
          type: string
          format: uuid
          title: Branch Id
        name:
          type: string
          title: Name
        duration_minutes:
          type: integer
          title: Duration Minutes
        price_kopecks:
          type: integer
          title: Price Kopecks
        is_active:
          type: boolean
          title: Is Active
        norms:
          items:
            $ref: '#/components/schemas/NormOut'
          type: array
          title: Norms
          default: []
      type: object
      required:
      - id
      - branch_id
      - name
      - duration_minutes
      - price_kopecks
      - is_active
      title: ServiceOut
    ShiftIn:
      properties:
        starts_at:
          type: string
          format: date-time
          title: Starts At
        ends_at:
          type: string
          format: date-time
          title: Ends At
      type: object
      required:
      - starts_at
      - ends_at
      title: ShiftIn
    ShiftOut:
      properties:
        starts_at:
          type: string
          format: date-time
          title: Starts At
        ends_at:
          type: string
          format: date-time
          title: Ends At
      type: object
      required:
      - starts_at
      - ends_at
      title: ShiftOut
    Slot:
      type: object
      properties:
        employee_id:
          type: string
          format: uuid
        starts_at:
          type: string
          format: date-time
        ends_at:
          type: string
          format: date-time
    StockItem:
      type: object
      properties:
        consumable_id:
          type: string
          format: uuid
        name:
          type: string
        unit:
          type: string
        quantity:
          type: number
        threshold:
          type: number
        is_low:
          type: boolean
        updated_at:
          type: string
          format: date-time
    Template:
      type: object
      properties:
        key:
          type: string
        subject:
          type: string
        body:
          type: string
    ThresholdRequest:
      type: object
      required:
      - threshold
      properties:
        threshold:
          type: number
          minimum: 0
    Token:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          example: Bearer
        expires_in:
          type: integer
        subject:
          type: string
          format: uuid
        username:
          type: string
        roles:
          type: array
          items:
            type: string
    TokenRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WorkloadOut:
      properties:
        since:
          type: string
          format: date-time
          title: Since
        until:
          type: string
          format: date-time
          title: Until
        employee_id:
          type: string
          format: uuid
          title: Employee Id
        appointments:
          type: integer
          title: Appointments
        completed:
          type: integer
          title: Completed
        busy_minutes:
          type: integer
          title: Busy Minutes
        commission_kopecks:
          type: integer
          title: Commission Kopecks
      type: object
      required:
      - since
      - until
      - employee_id
      - appointments
      - completed
      - busy_minutes
      - commission_kopecks
      title: WorkloadOut
paths:
  /appointments:
    post:
      summary: Создание записи
      parameters: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: Успешный ответ
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Токен отсутствует, просрочен или не проходит проверку
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Роли недостаточно либо объект принадлежит другому сотруднику
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Тело или параметры запроса не проходят проверку
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Сервис-исполнитель недоступен
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BookRequest'
      tags:
      - Записи
      operationId: booking_post_appointments
      security:
      - bearerAuth: []
      description: Создание записи. Администратор и управляющий.
  /appointments/{appointmentID}:
    get:
      summary: Карточка записи
      parameters:
      - name: appointmentID
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Appointment'
          description: Успешный ответ
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Токен отсутствует, просрочен или не проходит проверку
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Роли недостаточно либо объект принадлежит другому сотруднику
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
          description: Объект не найден
        '422':
